name: Sync watch

on:
  schedule:
    # 北京时间 07:30、13:30、19:30、22:30。白天练完的力量训练当天就能进快照，不必等到次日早上。
    - cron: '30 23 * * *'
    - cron: '30 5 * * *'
    - cron: '30 11 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write COROS strength and sleep into the private data repo
        env:
          COROS_ACCESS_TOKEN: ${{ secrets.COROS_ACCESS_TOKEN }}
          DATA_GITHUB_TOKEN: ${{ secrets.DATA_GITHUB_TOKEN }}
          DATA_OWNER: ${{ vars.DATA_OWNER }}
          DATA_REPO: ${{ vars.DATA_REPO }}
        run: python3 scripts/sync_watch.py
