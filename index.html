<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body { display: flex; align-items: center; justify-content: center; gap: 56px; }

.phone { width: 390px; height: 844px; border-radius: 54px; padding: 11px; background: #1C1C1E; box-shadow: 0 40px 90px rgba(0,0,0,.25), inset 0 0 0 2px #3A3A3C; flex-shrink: 0; }

.app .pg-review .lt-s { font-size: 13px; color: var(--label2); margin-top: 2px; white-space: nowrap; }

/* 计划页动作面板 */

.rest-float { position: absolute; right: 14px; z-index: 210; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.rest-cap { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; background: #1C1C1E; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.18); cursor: pointer; user-select: none; }
.rc-ring { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.rc-ring i { width: 20px; height: 20px; border-radius: 50%; background: #1C1C1E; }
.rc-t { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.rc-l { font-size: 13px; color: rgba(255,255,255,0.6); }
.rest-pop { background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.16); width: 248px; }
.rp-n { font-size: 13px; color: #8E8E93; margin-bottom: 10px; }
.rp-btns { display: flex; gap: 8px; }
.rp-b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; padding: 9px 0; border-radius: 10px; background: rgba(118,118,128,0.12); color: #1C1C1E; cursor: pointer; }
.rp-b.main { background: #E65A00; color: #fff; }


input, textarea, select, button { font: inherit; color: inherit; outline: none; }
input, textarea { border: none; background: transparent; -webkit-appearance: none; appearance: none; }
.app input::placeholder, .app textarea::placeholder { color: #C7C7CC; }
.app input { caret-color: #E65A00; }
.app button.btn-primary { width: 100%; cursor: pointer; }
.app button.btn-primary:disabled { opacity: 0.4; pointer-events: none; }
.app .list .cell.col { flex-direction: column; align-items: stretch; }

.app .pg-onboard .ob-ava img { width: 100%; height: 100%; object-fit: cover; }
.app .pg-onboard .ob-ava input { display: none; }
.app .pg-onboard .ob-ava-tip { margin-top: 8px; font-size: 13px; color: var(--label2); }

.app .pg-onboard .ob-pick.on { border-color: var(--accent, #E65A00); }
.app .pg-onboard .ob-pick b { display: block; font-size: 17px; font-weight: 600; color: var(--label); }
.app .pg-onboard .ob-pick i { display: block; font-size: 13px; font-style: normal; color: var(--label2); margin-top: 4px; line-height: 1.4; }
.app .pg-onboard .ob-foot { margin: 28px 0 40px; }
.app .tpl-tags { display: flex; gap: 6px; margin-top: 8px; }

.date-pick, .ex-pick, .base-pick, .pick-cell { position: relative; }

.lib-back { color: #E65A00; font-size: 17px; padding: 2px 0 12px; display: inline-block; }
.app #body > div { background: #F2F2F7; min-height: 100%; }
.app .lib-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cyc-nav { display: flex; align-items: center; gap: 4px; }
.cyc-btn { width: 24px; height: 24px; border-radius: 50%; background: #EFEFF4; color: #E65A00; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }

.cyc-label { font-size: 15px; }
.total-cap { display: block; margin-top: 7px; }
.ios-sw { position: relative; display: inline-block; width: 51px; height: 31px; flex-shrink: 0; }

}


.app {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: rgba(118,118,128,0.12); --fill2: rgba(118,118,128,0.08);
  --sep: rgba(60,60,67,0.12); --label: #1C1C1E; --label2: #6C6C70; --label3: #8E8E93;
  --accent: #E65A00; --accent-soft: rgba(230,90,0,0.12);
  --blue: #0A84FF; --green: #34C759; --amber: #FF9F0A; --red: #FF3B30; --purple: #AF52DE; --teal: #5AC8FA;
  background: var(--bg);
  color: var(--label);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
.page { padding: 8px 16px 32px; box-sizing: border-box; }
.num { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.25px; }
.flex1 { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.gap { gap: 8px; }
.muted, .dim, .cap { color: var(--label2); }
.cap { font-size: 13px; }
.accent, .rust { color: var(--accent); }
.amber { color: var(--amber); }
.green { color: var(--green); }
.red { color: var(--red); }
.strong { color: var(--label); font-weight: 600; }


.large-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; }


.card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.card-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.card-title .t { font-size: 17px; font-weight: 600; }
.card-title .s { font-size: 13px; color: var(--label2); }
.link { font-size: 15px; color: var(--accent); }


.sec-h { font-size: 13px; color: var(--label2); padding: 16px 16px 7px; }
.sec-f { font-size: 13px; color: var(--label2); padding: 7px 16px 4px; line-height: 1.5; }
.list { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 4px; }
.cell { position: relative; display: flex; align-items: center; min-height: 46px; padding: 9px 16px; box-sizing: border-box; font-size: 17px; }
.cell + .cell::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.cell.tap:active { background: var(--fill2); }
.cell .val { color: var(--label2); }
.chev { color: var(--label3); font-size: 15px; margin-left: 6px; }


.seg, .tabs { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 12px; }
.seg-i, .tabs .tab { position: relative; flex: 1; text-align: center; padding: 6px 0; font-size: 13px; font-weight: 500; color: var(--label); border-radius: 7px; white-space: nowrap; }
.seg-i.on, .tabs .tab.on { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,0.10), 0 1px 1px rgba(0,0,0,0.04); }

/* ===== Liquid Glass（iOS 26/27 设计语言）=====
 * 1 层级：导航与标签栏是浮在内容之上的玻璃层，内容铺满并从下方滚过
 * 2 和谐：胶囊形控件、同心圆角、更高的控件、更大更粗的左对齐标题
 * 3 一致：同一套玻璃材质用于标签栏、弹层、完成栏；适配降低透明度 / 增强对比度 / 减弱动态效果
 */
.app { --navh: 44px; --tabh: 62px; --tabgap: 12px; --tabbottom: calc(var(--tabgap) + env(safe-area-inset-bottom));
  --glass: rgba(250,250,252,0.78); --glass-edge: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.09);
  --glass-blur: blur(28px) saturate(190%); }
@media (min-width: 761px) { .app { --tabbottom: 22px; } }
@media (max-width: 760px) { .app { --navh: calc(44px + env(safe-area-inset-top)); } }

/* 导航栏：透明，内容从下面滚过；滚动后出现「滚动边缘效果」与小标题 */
.app .nav { height: var(--navh); margin-bottom: calc(-1 * var(--navh)); background: transparent; z-index: 20; pointer-events: none; }
.app .nav .capsule { pointer-events: auto; }
.app .nav::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: calc(100% + 22px); z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(242,242,247,0.96) 0%, rgba(242,242,247,0.82) 62%, rgba(242,242,247,0) 100%);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent); mask-image: linear-gradient(to bottom, #000 58%, transparent);
  opacity: 0; transition: opacity .25s ease; }
.app .nav.edge::before { opacity: 1; }
.app #navTitle { opacity: 0; transform: translateY(4px); transition: opacity .2s ease, transform .2s ease; }
.app .nav.titled #navTitle { opacity: 1; transform: none; }
.app #body { padding-top: var(--navh); padding-bottom: 0; }
.app .pg-train .page { padding-bottom: calc(var(--tabh) + var(--tabbottom) + 32px); }
.app #body > div > .page::after { content: ''; display: block; height: calc(var(--tabh) + var(--tabbottom) + 16px); }

/* 大号、加粗、左对齐的页面标题 */
.app .pg-title { font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15; margin: 6px 4px 16px; color: var(--label); }
.app .large-title { font-weight: 700; letter-spacing: -0.6px; }
.app .head { padding-left: 4px; }

/* 浮动玻璃标签栏 */
.app .tabbar { position: absolute; left: 16px; right: 16px; bottom: var(--tabbottom); height: var(--tabh); padding: 0 6px; z-index: 50;
  align-items: center; border-top: none; border-radius: 999px; background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-edge), 0 10px 30px rgba(0,0,0,0.12); }
.phone .tabbar, .app .tabbar { padding-bottom: 0; }
.app .tb-item { height: calc(var(--tabh) - 12px); border-radius: 999px; transition: background .25s ease, transform .15s ease; }
.app .tb-item.on { background: rgba(118,118,128,0.14); }
.app .tb-item:active { transform: scale(0.92); }

/* 卡片与分组列表：更柔和的同心圆角、更高的行 */
.app .card { border-radius: 26px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.app .list { border-radius: 26px; }
.app .cell { min-height: 52px; }
.app .sec-h { font-size: 17px; font-weight: 600; color: var(--label); padding: 26px 6px 10px; }
.app .sec-f { padding-left: 6px; padding-right: 6px; }
.app .card-title .t { font-weight: 700; }

/* 胶囊形控件 */
.app .seg, .app .tabs { border-radius: 999px; padding: 3px; }
.app .seg-i, .app .tabs .tab { border-radius: 999px; padding-top: 8px; padding-bottom: 8px; transition: background .2s ease, box-shadow .2s ease; }
.app .seg-i.on, .app .tabs .tab.on { box-shadow: 0 3px 8px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.04), inset 0 1px 0 #fff; }
.app .btn-primary { border-radius: 999px; min-height: 52px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.12); transition: transform .15s ease, opacity .15s; background: var(--accent); color: #FFFFFF; }
.app .btn-primary:active, .app .btn-ghost:active, .app .go-btn:active { transform: scale(0.97); }
.app .btn-ghost { border-radius: 999px; }
.app .pg-train .stepper { border-radius: 999px; }
.app .pg-train .verdict { border-radius: 16px; }
.app .pg-train .w-edit { border-radius: 999px; }

/* 按压反馈：轻微收缩，像在按一块玻璃 */
.app .ex-row, .app .cell.tap, .app .gcell { transition: transform .15s ease, background .15s ease; }
.app .ex-row:active, .app .cell.tap:active { transform: scale(0.985); }

/* 训练页完成栏：随页面自然流动，不再浮在内容上遮挡下方动作与数据 */
.app .pg-train .submit-bar { position: relative; bottom: auto; margin: 24px 0 0; padding: 0; gap: 10px;
  background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border-top: none; }
.app .pg-train .sb-count { height: 52px; padding: 0 16px; min-width: 74px; justify-content: center; display: flex; align-items: center; border-radius: 999px; background: rgba(255,255,255,0.92);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 0 0.5px rgba(0,0,0,0.06); }
.app .pg-train button.sb-btn { height: 52px; }

/* 弹层：浮起的玻璃面板，四角与屏幕圆角同心 */
.app #body .mask, .app .mask { bottom: 0; background: rgba(0,0,0,0.22); z-index: 100; }
.app .sheet { --bg: #F5F5F8; width: calc(100% - 16px); margin: 0 8px calc(8px + env(safe-area-inset-bottom)); border-radius: 34px;
  background: rgba(245,245,248,0.97); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 20px 60px rgba(0,0,0,0.18); max-height: calc(100% - 70px); }
.app .grabber { width: 36px; height: 5px; background: rgba(60,60,67,0.25); }
.app .sheet-title { font-weight: 700; }

/* 休息胶囊、提示：同一套玻璃语言 */
.app .rest-cap { background: rgba(28,28,30,0.82); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 24px rgba(0,0,0,0.22); }
.app .rc-ring i { background: #2A2A2C; }
.app .rest-pop { border-radius: 24px; background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-edge), 0 12px 32px rgba(0,0,0,0.16); }
.app .rp-b { border-radius: 999px; }
.app #toast { border-radius: 999px; padding: 12px 22px; }

.app .lib-rec { color: var(--label2); }
/* 辅助功能 */
@media (prefers-reduced-transparency: reduce) {
  .app .tabbar, .app .sheet, .app .pg-train .sb-count, .app .rest-pop { background: #FFFFFF; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .app .nav::before { background: #F2F2F7; -webkit-mask-image: none; mask-image: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .app .rest-cap { background: #1C1C1E; }
}
@media (prefers-contrast: more) {
  .app .tabbar, .app .sheet, .app .pg-train .sb-count { box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
  .app .card, .app .list { box-shadow: 0 0 0 1px rgba(0,0,0,0.18); }
}
@media (prefers-reduced-motion: reduce) {
  .app *, .app *::before { transition: none !important; }
}

    '器械': { inc: 2.5, step: 2.5, incL: 5, stepL: 5 },

  // ---------- 视图模型：计划页（按轮显示，每轮 N 周 × 4 日） ----------

    var maxCycle = Math.max(curCycle, dataCycle) + 2; // 向后可看第二轮、第三轮

  // ---------- 视图模型：数据统计 ----------
  function liftSlots(db) {

  function buildStats(db) {

    var t1n = 0, t1ok = 0, t2n = 0, t2ok = 0, t3n = 0, t3add = 0, totalVol = 0, reps = 0;
    S.forEach(function (s) {

        if (it.deload || it.judgment === '跳过') return;

        if (it.tier === 'T2') { t2n++; if (it.input === '完成') t2ok++; reps += it.actualReps || 0; }

    var weeks = Math.max(maxWeek, 1), labels = [], v1 = [], v2 = [], v3 = [];

  // ---------- 视图模型：回顾 & 总结 ----------

      var adds = 0, warns = 0, lines = [];

        s.items.forEach(function (it) {

        });
      });
      var t1 = ss.map(function (s) {

      });

    }).join('');

  async function paintSharePreview() {
    var sh=S.review.share, box=document.getElementById('shareArtwork'); if(!sh||!box) return;
    sh.image=null; sh.blob=null;
    var generation=(sh.generation || 0)+1; sh.generation=generation;
    try {
      var isMonth = sh.kind === 'month';
      var data = isMonth ? Monthly.build(viewDb(), sh.ym, sh) : Share.build(viewDb(),sh.id,sh); if(!data) return;
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      var canvas=document.createElement('canvas'); await (isMonth ? Monthly.draw(canvas,data,sh.theme) : Share.draw(canvas,data,sh.theme));
      var blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/png');});
      if(S.review.share!==sh || sh.generation!==generation || !box.isConnected) return;
      if(!blob) throw new Error('导出失败');
      sh.blob=blob;sh.image=canvas.toDataURL('image/png');
      box.innerHTML='';var img=new Image();img.src=sh.image;img.alt=data.name+' · '+(isMonth ? data.title+' 月报' : data.date+' 训练战报');box.appendChild(img);
      document.querySelectorAll('[data-act="shareexport"],[data-act="sharesystem"]').forEach(function(b){b.disabled=false;});
    } catch(e) { if(box.isConnected) box.textContent='图片生成失败，请关闭后重试。'; }
  }
  function exportShareImage(system) {

      navigator.share({files:[file],title:isMonth ? '月报 · '+sh.ym : '训练战报 · '+sh.date+' '+(sh.day||'')}).catch(function(e){if(e.name!=='AbortError') toast('系统分享暂不可用，可保存图片后分享');});return;

  function setPath(o, p, v) { var ks = p.split('.'); for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
  function mutate(fn, tip) { var db = load(); fn(db); save(db); if (tip !== false) toast(tip || '已更新，数据已重算'); return true; }
  function markBackup() { localStorage.setItem(BK, String(Date.now())); }
  function exportFile() {
    var txt = JSON.stringify(load()), name = '训练备份_' + GZ.today() + '.json';
    var blob = new Blob([txt], { type: 'application/json' });
    try {
      var file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(function () { markBackup(); render(true); toast('已导出'); }, function () {});
        return;
      }
    } catch (e) {}
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    markBackup(); render(true); toast('已下载备份文件');
  }
  function importText(txt) {
    try { var inc = JSON.parse(txt); if (!inc || !inc.params || !inc.days) throw 0; save(GZ.replaceDb(load(), inc)); S.settings.imp = false; S.train.draft = null; S.train.day = null; clearTrainDays(); toast('恢复成功'); render(true); }
    catch (e) { toast('文件内容不正确'); }
  }
  function importWatch(txt) {
    try {
      var clean = Badges.sanitizeWatch(txt), db = load();
      db.params.watch = Badges.mergeWatch(db.params.watch, clean); save(db);
      S.settings.wpaste = false; toast('已导入 ' + clean.workouts.length + ' 次训练、' + Object.keys(clean.sleep).length + ' 晚睡眠'); render(true);
    } catch (e) { toast(e && e.message ? e.message : '快照内容不正确'); }
  }
  function syncAddInputs() {
    var a = S.settings.add; if (!a) return;
    var n = document.querySelector('[data-act=addname]'), d = document.querySelector('[data-act=adddesc]');
    if (n) a.name = n.value; if (d) a.desc = d.value;
  }
  function settingsAct(act, ds, el) {
    var st = S.settings, si = Number(ds.si);
    var slotMut = function (fn) { return mutate(function (db) { fn(db.days[st.d].slots[si], db); }); };
    switch (act) {
      case 'profiletext':
        return mutate(function(db) { var pp = Share.profile(db.params.shareProfile); pp[ds.k] = el.value; db.params.shareProfile = Share.profile(pp); }, '分享名片已保存');
      case 'profilegender':
        return mutate(function (db) { var pp = Share.profile(db.params.shareProfile); pp.gender = ds.v; db.params.shareProfile = Share.profile(pp); }, '性别已保存');
      case 'profileweight': return mutate(function(db) { var pp=Share.profile(db.params.shareProfile); pp.showWeight=el.checked; db.params.shareProfile=pp; }, el.checked ? '卡片会显示已记录的当天体重' : '卡片不再公开体重');
      case 'profilenoavatar': return mutate(function(db) { var pp=Share.profile(db.params.shareProfile); pp.avatar=''; db.params.shareProfile=pp; }, '头像已移除');
      case 'profileavatar':
        uploadShareAvatar(el.files && el.files[0]); return false;
      case 'editdir':
        S.onboard.force = true; S.onboard.step = 2; S.onboard.returnTab = 'settings'; return true;
      case 'param': var v = parseFloat(el.value); if (isNaN(v) || v < 0) return true; if (ds.pct) v = v / 100; return mutate(function (db) { setPath(db.params, ds.k, v); });
      case 'mode': return mutate(function (db) { db.params.ruleMode = ds.v; }, ds.v === 'full' ? '已切换：完整三阶规则' : '已切换：严格按表格公式');
      case 'adaptsw': return mutate(function (db) { db.params.adaptive = el.checked; }, el.checked ? '已开启：按末组次数自适应加重' : '已关闭：固定步幅加重');
      case 'openlib': st.view = 'lib'; st.q = ''; render(); return false;
      case 'libback': st.view = ''; st.add = null; render(); return false;
      case 'libfilter':
        if (ds.k === 'pattern') {
          st.pattern = ds.v;
          if (ds.v && st.part && GZ.patternOfPart(st.part).id !== ds.v) st.part = '';
        } else st[ds.k] = ds.v;
        return true;
      case 'libq':
        st.q = el.value;
        var ll = document.getElementById('libList'); if (ll) ll.innerHTML = '<div class="list">' + libRows(GZ.buildLibrary(load(), { catalog: true, pattern: st.pattern, part: st.part, equip: st.equip, q: st.q }), {}) + '</div>';
        return false;
      case 'libdel':
        confirmBox('删除「' + ds.name + '」？', '已经练过的记录会保留；正在使用它的训练位置仍按原名显示。', function () { var dbd = load(); GZ.removeCustomEx(dbd, ds.name); save(dbd); render(true); });
        return false;
      case 'libadd': st.add = { name: '', desc: '', part: st.part || '上肢·水平推', equip: st.equip || '杠铃' }; return true;
      case 'addclose': st.add = null; return true;
      case 'addname': st.add.name = el.value; return false;
      case 'adddesc': st.add.desc = el.value; return false;
      case 'addpart': st.add.part = el.value; return true;
      case 'addequip': st.add.equip = el.value; return true;
      case 'adddo':
        syncAddInputs();
        var dba = load(), err = GZ.addCustomEx(dba, st.add);
        if (err) { toast(err); return false; }
        save(dba); st.pattern = GZ.patternOfPart(st.add.part).id; st.part = st.add.part; st.equip = ''; st.q = ''; st.add = null; render(); toast('已添加'); return false;
      case 'advtoggle': st.adv = !st.adv; return true;
      case 'goplan': S.tab = 'plan'; S.plan.view = ''; S.plan.from = 'train'; render(); return false;
      case 'export': exportFile(); return false;
      case 'syncconnect':
        if (st.connecting) return false;
        var ow = (document.getElementById('syncOwner').value || '').trim(), rp2 = (document.getElementById('syncRepo').value || '').trim(), tk = (document.getElementById('syncToken').value || '').trim();
        if (!ow || !rp2) { toast('请填写用户名和仓库名'); return false; }
        if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tk)) { toast('令牌格式不对：应以 github_pat_ 开头，请整串复制一次'); return false; }
        st.connecting = true; render(true);
        Sync.connect(ow, rp2, tk).then(function (err) { st.connecting = false; if (err) { Sync.disconnect(); toast(err); } else toast('云同步已开启'); render(true); });
        return false;
      case 'syncnow': Sync.run(true); return false;
      case 'synctoken': st.tok = !st.tok; return true;
      case 'synctokdo':
        var nt = (document.getElementById('syncToken2').value || '').trim();
        if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(nt)) { toast('令牌格式不对'); return false; }
        var cc = Sync.cfg(); Sync.connect(cc.owner, cc.repo, nt).then(function (err) { if (err) { var c0 = cc; localStorage.setItem(SYNC_KEY, JSON.stringify(c0)); toast(err); } else { st.tok = false; toast('令牌已更换'); } render(true); });
        return false;
      case 'syncoff': confirmBox('断开云同步？', '本机数据保留，云端仓库里的数据也不会删除。之后可以随时重新连接。', function () { Sync.disconnect(); render(true); toast('已断开'); }); return false;
      case 'copyjson': copyText(JSON.stringify(load()), '已复制，粘贴到文件传输助手保存'); markBackup(); setTimeout(function () { render(true); }, 50); return false;
      case 'impfile':
        var f = el.files && el.files[0]; if (!f) return false;
        var rd = new FileReader(); rd.onload = function () { confirmBox('从文件恢复？', '当前设备上的数据会被备份文件覆盖。', function () { importText(rd.result); }); }; rd.readAsText(f); el.value = ''; return false;
      case 'watchfile':
        var wf = el.files && el.files[0]; if (!wf) return false;
        var wr = new FileReader(); wr.onload = function () { importWatch(wr.result); }; wr.readAsText(wf); el.value = ''; return false;
      case 'watchpull': Sync.pullWatch(true); return false;
      case 'watchpaste': st.wpaste = !st.wpaste; return true;
      case 'watchdo': importWatch(document.getElementById('watchText').value); return false;
      case 'watchclear': confirmBox('清除手表数据？', '只清除导入的手表快照；训练记录不受影响。手表系列的里程碑会重新变为未获得。', function () { mutate(function (db) { db.params.watch = null; var c = Sync.cfg(); if (c) { c.watchAt = 0; c.watchErr = ''; localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } }, '已清除手表数据'); st.wpaste = false; render(true); }); return false;
      case 'imp': st.imp = !st.imp; return true;
      case 'doImp': importText(document.getElementById('impText').value); return false;
      case 'clear': confirmBox('清空全部训练记录？', '参数与动作配置保留，记录无法恢复。', function () { mutate(function (db) { GZ.clearRecords(db); }, '已清空'); S.train.draft = null; S.train.day = null; clearTrainDays(); render(true); }); return false;
      case 'restore': confirmBox('恢复 Excel 默认？', '参数、动作配置与记录将恢复为表格初始状态（含第 1 周 A1/B1 记录）。', function () { save(GZ.replaceDb(load(), GZ.defaults(true))); S.train = { day: null, draft: null, recordId: null, date: GZ.today(), bw: '', note: '', result: null }; render(true); toast('已恢复'); }); return false;
    }
  }

  // ================= 框架 =================
  var RENDER = { train: renderTrain, plan: renderPlan, stats: renderData, tools: renderTools, settings: renderSettings };
  var ACT = { train: trainAct, plan: planAct, stats: dataAct, tools: toolsAct, settings: settingsAct };
  var PGCLS = { train: 'pg-train', plan: 'pg-plan', stats: 'pg-stats pg-review', tools: 'pg-tools pg-plan', settings: 'pg-settings' };
  function render(keepScroll) {
    var body = document.getElementById('body'), y = body.scrollTop;
    var tb = document.getElementById('tabbar');
    if (gateOnboard()) {
      syncOnboardStep(load());
      if (tb) tb.style.display = 'none';
      document.getElementById('navTitle').textContent = S.onboard.step === 2 ? '训练方向' : '建立档案';
      body.innerHTML = '<div class="pg-onboard"><div class="page">' + renderOnboarding() + '</div></div>';
      body.scrollTop = keepScroll ? y : 0;
      navState();
      return;
    }
    if (tb) tb.style.display = '';
    var title = TABS.filter(function (t) { return t.id === S.tab; })[0].title;
    var isLib = S.tab === 'settings' && S.settings.view === 'lib';
    var toolsBrowse = S.tab === 'tools' && S.plan.view === 'browse';
    document.getElementById('navTitle').textContent = isLib ? '动作库' : toolsBrowse ? '计划详情' : title;
    var bigTitle = S.tab === 'train' || S.tab === 'plan' || isLib || toolsBrowse ? '' : '<div class="pg-title">' + title + '</div>';
    body.innerHTML = '<div class="' + (PGCLS[S.tab] || ('pg-' + S.tab)) + '"><div class="page">' + bigTitle + RENDER[S.tab]() + '</div></div>';
    body.scrollTop = keepScroll ? y : 0;
    navState();
    var hl = S.tab === 'plan' ? 'train' : S.tab;
    document.querySelectorAll('.tb-item').forEach(function (el) { el.classList.toggle('on', el.dataset.tab === hl); });
    if (S.tab === 'stats') requestAnimationFrame(drawStats);
    if (S.tab === 'stats' && S.review.share) paintSharePreview();
  }
  /** 导航栏：一滚动就出现滚动边缘效果；滚过大标题后才显示小标题（iOS 大标题导航的行为） */
  function navState() {
    var body = document.getElementById('body'), nav = document.querySelector('.nav'); if (!body || !nav) return;
    nav.classList.toggle('edge', body.scrollTop > 4);
    nav.classList.toggle('titled', body.scrollTop > 46);
  }
  function handle(e, type) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var tag = el.tagName, isField = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
    if (type === 'click' && isField) return;
    if (type === 'change' && !isField) return;
    if (type === 'input' && ['note', 'bw', 'swapq', 'libq', 'slotq', 'obbw'].indexOf(el.dataset.act) < 0) return;
    if (type === 'change' && (el.dataset.act === 'swapq' || el.dataset.act === 'libq')) return;
    if (el.classList.contains('mask') && e.target.closest('[data-stop]')) return;
    var prevTab = S.tab;
    var res = gateOnboard() ? onboardAct(el.dataset.act, el.dataset, el) : ACT[S.tab](el.dataset.act, el.dataset, el);
    if (res) render(prevTab === S.tab && !gateOnboard());
  }
  /** 当前如果在子目录里，返回上一级要触发的动作；根页面和弹层里不响应 */
  function parentBack() {
    if (document.querySelector('.mask')) return null;
    if (gateOnboard()) {
      if (S.onboard.step !== 2) return null;
      return { act: S.onboard.force ? 'obcancel' : 'obback', onboard: true };
    }
    var back = document.querySelector('#body .lib-back');
    if (!back) return null;
    return { act: back.dataset.act, ds: back.dataset, el: back };
  }
  function runParentBack(back) {
    if (!back) return;
    if (back.onboard) { if (onboardAct(back.act, {}, null)) render(); return; }
    var prevTab = S.tab, res = ACT[S.tab](back.act, back.ds, back.el);
    if (res) render(prevTab === S.tab && !gateOnboard());
  }
  /** 从屏幕左侧右滑，跟手退出当前目录，松手超过一段距离才回到上一级 */
  function bindSwipeBack() {
    var app = document.querySelector('.app');
    if (!app) return;
    var drag = null, swallow = false;
    app.addEventListener('click', function (e) {
      if (!swallow) return;
      swallow = false; e.preventDefault(); e.stopPropagation();
    }, true);
    app.addEventListener('pointerdown', function (e) {
      if (drag || (e.button != null && e.button !== 0)) return;
      if (e.target.closest('input, textarea, select, canvas, #rest, #tabbar')) return;
      var back = parentBack(); if (!back) return;
      var edge = app.getBoundingClientRect().left;
      if (e.clientX - edge > 44) return;
      var shell = document.querySelector('#body > div');
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, back: back, shell: shell, on: false };
    });
    app.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.dx = dx; drag.dy = dy;
      if (!drag.on) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dy) > Math.abs(dx) || dx < 10) { drag = null; return; }
        drag.on = true;
      }
      if (dx < 0) dx = 0;
      if (drag.shell) {
        drag.shell.style.transition = 'none';
        drag.shell.style.transform = 'translate3d(' + dx + 'px,0,0)';
        drag.shell.style.boxShadow = '-12px 0 28px rgba(0,0,0,.12)';
      }
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    function finish(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      if (d.on) { swallow = true; setTimeout(function () { swallow = false; }, 350); }
      var shell = d.shell, go = d.on && d.dx > 72;
      if (!shell) { if (go) runParentBack(d.back); return; }
      if (!go) {
        shell.style.transition = 'transform .22s ease';
        shell.style.transform = '';
        shell.style.boxShadow = '';
        return;
      }
      shell.style.transition = 'transform .18s ease';
      shell.style.transform = 'translate3d(100%,0,0)';
      setTimeout(function () { runParentBack(d.back); }, 170);
    }
    app.addEventListener('pointerup', finish);
    app.addEventListener('pointercancel', finish);
  }
  document.addEventListener('DOMContentLoaded', function () {
    var body = document.getElementById('body');
    body.addEventListener('click', function (e) { handle(e, 'click'); });
    body.addEventListener('change', function (e) { handle(e, 'change'); });
    body.addEventListener('input', function (e) { handle(e, 'input'); });
    body.addEventListener('scroll', navState, { passive: true });
    document.getElementById('tabbar').addEventListener('click', function (e) {
      var it = e.target.closest('.tb-item'); if (!it) return;
      if (S.tab === it.dataset.tab || (it.dataset.tab === 'train' && S.tab === 'plan')) { body.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      var prevTab = S.tab;
      S.tab = it.dataset.tab; render(); if (rest.show) renderRest();
      if (S.tab === 'stats' && S.review.returnTo && prevTab === 'settings') {
        var back = S.review.returnTo; S.review.returnTo = null;
        S.data.seg = 2;
        S.review.share = shareRestore(back);
        render();
      }
    });
    document.getElementById('rest').addEventListener('click', function (e) {
      var a = e.target.closest('[data-rest-adj]'), s = e.target.closest('[data-rest-stop]');
      if (a) { rest.left = Math.max(5, rest.left + Number(a.dataset.restAdj)); rest.total = Math.max(rest.total, rest.left); renderRest(); }
      if (s) { clearInterval(rest.timer); rest.show = false; renderRest(); }
      if (e.target.closest('[data-rest-toggle]')) { rest.open = !rest.open; renderRest(); }
    });
    document.addEventListener('visibilitychange', function () { var c = Sync.cfg(); if (document.visibilityState === 'visible' && Sync.on() && (!c.lastAt || Date.now() - c.lastAt > 30000)) Sync.run(); });
    window.addEventListener('online', function () { if (Sync.on()) Sync.run(); });
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (S.tab === 'stats') drawStats(); }, 120); });
    bindSwipeBack();
    render();
    if (Sync.on()) Sync.run();
  });
})();
</script>
</body></html>
